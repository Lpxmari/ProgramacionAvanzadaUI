<div class="min-h-screen bg-white flex items-center justify-center px-4">
  <div class="w-full max-w-md">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-10">
      <div class="w-20 h-20 rounded-xl bg-[#006926] flex items-center justify-center mb-3 shadow-lg">
        <svg viewBox="0 0 80 80" class="w-14 h-14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="50%" y="58%" dominant-baseline="middle" text-anchor="middle"
                font-size="48" font-weight="bold" fill="white">U</text>
        </svg>
      </div>
      <p class="text-xs font-bold tracking-widest text-[#006926] uppercase">Universidad del Quindío</p>
    </div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="login()" class="flex flex-col gap-4">

      <!-- Username -->
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </span>
        <input formControlName="username" type="text" placeholder="Nombre de usuario"
          class="w-full rounded-xl border border-gray-200 pl-10 pr-4 py-3 text-sm
                 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#65b983]
                 focus:border-[#006926] transition-all placeholder:text-gray-400" />
      </div>

      <!-- Password -->
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0
                 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </span>
        <input formControlName="password" type="password" placeholder="Contraseña"
          class="w-full rounded-xl border border-gray-200 pl-10 pr-4 py-3 text-sm
                 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#65b983]
                 focus:border-[#006926] transition-all placeholder:text-gray-400" />
      </div>

      <!-- Error -->
      @if (error()) {
        <p class="text-red-500 text-xs text-center">{{ error() }}</p>
      }

      <!-- Submit -->
      <button type="submit" [disabled]="form.invalid || loading()"
        class="w-full py-3 rounded-xl bg-[#006926] text-white font-semibold text-sm
               hover:bg-[#005520] active:scale-[0.98] transition-all duration-150
               disabled:bg-[#65b983] disabled:cursor-not-allowed shadow-md">
        {{ loading() ? 'Ingresando...' : 'Acceder' }}
      </button>

      <!-- Forgot -->
      <p class="text-center">
        <a href="#" class="text-xs text-[#006926] hover:underline">¿Olvidó su contraseña?</a>
      </p>

    </form>
  </div>
</div>
